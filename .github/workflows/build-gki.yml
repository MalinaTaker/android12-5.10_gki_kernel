name: Novri Kernel - AOSP Source Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-gki.yml"

permissions:
  contents: read

jobs:
  source-sync:
    name: Sync Android 12 GKI Source
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install Repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Android Kernel manifest
        run: |
          mkdir android-kernel
          cd android-kernel

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-2026-10

      - name: Sync source repositories
        working-directory: android-kernel
        run: |
          repo sync -c -j4 --fail-fast

      - name: Verify kernel source
        working-directory: android-kernel
        run: |
          echo "===== KERNEL VERSION ====="
          head -n 5 common/Makefile

          echo "===== KERNEL COMMIT ====="
          git -C common rev-parse HEAD

          echo "===== BUILD SCRIPT ====="
          test -f build/build.sh
          echo "Build script exists!"

          echo "===== GKI CONFIG ====="
          test -f common/build.config.gki.aarch64
          echo "ARM64 GKI config exists!"

          echo "===== CLANG TOOLCHAIN ====="
          find prebuilts-master/clang/host/linux-x86 \
            -maxdepth 2 -type d | head -n 10

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: Novri-GKI-Source-Manifest
          path: android-kernel/.repo/manifests/
          retention-days: 7
