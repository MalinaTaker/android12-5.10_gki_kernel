name: Novri Kernel - First GKI Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 GKI 5.10
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install Repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Android Kernel manifest
        run: |
          mkdir android-kernel
          cd android-kernel

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-2026-10

      - name: Sync source repositories
        working-directory: android-kernel
        run: |
          repo sync -c -j4 --fail-fast

      - name: Verify source and configuration
        working-directory: android-kernel
        run: |
          echo "===== KERNEL VERSION ====="
          head -n 5 common/Makefile

          echo "===== KERNEL COMMIT ====="
          git -C common rev-parse HEAD

          echo "===== BUILD SCRIPT ====="
          test -f build/build.sh

          echo "===== ARM64 GKI CONFIG ====="
          test -f common/build.config.gki.aarch64

          echo "===== CLANG ====="
          find prebuilts-master/clang/host/linux-x86 \
            -maxdepth 3 -name clang -type f | head

      - name: Build Novri GKI ARM64
        working-directory: android-kernel
        run: |
          export BUILD_CONFIG=common/build.config.gki.aarch64
          export LTO=thin
          export OUT_DIR="$GITHUB_WORKSPACE/out"
          export DIST_DIR="$GITHUB_WORKSPACE/dist"

          build/build.sh -j4

      - name: Verify build artifacts
        run: |
          echo "===== BUILD OUTPUT ====="
          find dist -maxdepth 3 -type f -printf "%p (%s bytes)\n"

          test -d dist
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Upload Novri Kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Novri-GKI-5.10.269-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 14
